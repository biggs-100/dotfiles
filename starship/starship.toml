# Starship config — Catppuccin Mocha (replicating oh-my-posh theme)
# https://starship.rs/config

format = """
$username\
$os\
$hostname\
$directory\
$git_branch\
$git_status\
$character"""

# Paleta Catppuccin Mocha
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"

[username]
show_always = true
style_user = "bold blue"
style_root = "bold red"
format = '[$user]($style)@'

[os]
disabled = false
style = "bold dimmed text"
format = '[$symbol]($style) '

[os.symbols]
Windows = ""
Macos   = ""
Linux   = ""
Arch    = ""
Ubuntu  = ""
Debian  = ""

[hostname]
ssh_only = false
style = "bold blue"
format = '[$hostname]($style) '

[directory]
style = "bold pink"
format = '[$path]($style)/'
truncation_length = 3
truncate_to_repo = true

[directory.substitutions]
"Documents" = ""
"Downloads" = ""
"Music" = ""
"Pictures" = ""
"Desktop" = ""

[git_branch]
symbol = ""
style = "bold lavender"
format = '[$symbol $branch]($style)'

[git_status]
style = "bold red"
format = '[$all_status$ahead_behind]($style) '

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'
